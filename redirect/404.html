<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Achiziții deschise</title>
    <link rel="canonical" href="https://projects.cristian-nichifor.com/open-procurement/" />
    <meta name="robots" content="noindex" />
    <!--
      The site moved to projects.cristian-nichifor.com/open-procurement/. GitHub Pages serves
      this file at the root and, as 404.html, for every other path, so the script maps
      /open-procurement/<rest>?<query>#<hash> onto the same place on the new host. The hash
      matters most: every view, search and drill-down lives there, so dropping it would send
      a shared link to a different view than the one shared. The meta refresh is the
      no-JavaScript fallback and can only reach the front page.
    -->
    <script>
      (function () {
        var base = 'https://projects.cristian-nichifor.com/open-procurement';
        var rest = location.pathname.replace(/^\/open-procurement(?=\/|$)/, '');
        location.replace(base + (rest || '/') + location.search + location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://projects.cristian-nichifor.com/open-procurement/" />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #7fb3ff;
      }
      p {
        max-width: 32rem;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
        a {
          color: #1a5fd0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Site-ul s-a mutat</h1>
      <p>
        Achiziții deschise se află acum pe projects.cristian-nichifor.com. Ar trebui să fii
        redirecționat imediat, cu tot cu vizualizarea din link.
      </p>
      <p>
        <a href="https://projects.cristian-nichifor.com/open-procurement/">Deschide site-ul</a>
      </p>
    </main>
  </body>
</html>
