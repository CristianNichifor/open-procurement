name: pages

# GitHub Pages now serves only a redirect. The site is published to Cloudflare Pages by
# deploy-pages-cloudflare.yml and served at projects.cristian-nichifor.com/open-procurement/;
# redirect/ holds an index.html and a 404.html (the page GitHub Pages returns for any unknown
# path) that send cristiannichifor.github.io/open-procurement/<rest>?<query>#<hash> to the same
# place there, so every link already shared keeps opening the view it was shared for.
#
# Nothing is built here: no install, no bundle fetch.

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it complete and queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A redirect that points at nothing is worse than no redirect: it turns a working link
      # into a loop through a 404. Checked here so the stub cannot go live before the site it
      # forwards to.
      - name: Check the destination is live
        run: |
          url=https://projects.cristian-nichifor.com/open-procurement/
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "::error::destination is not serving; refusing to publish the redirect"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
