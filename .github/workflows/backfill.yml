name: backfill unit prices

# Collects ONE past day from SEAP, on GitHub's infrastructure.
#
# WHY ONE DAY
#
# A weekday is about 9,700 requests. SEAP blocks an IP that sends more than 500 in 5
# minutes or more than 50 in a second, so the collector holds itself to 450 and 2
# (src/achizitii/client.py), which makes a weekday about 1 h 50 min. One day per dispatch
# keeps every run inside the job timeout with room to spare, makes each run's request
# count and outcome readable on its own, and means a block costs at most the day in hand.
# The range loop this replaces could run for six hours unattended.
#
# It shares the `ingest-seap` concurrency group with publish-data.yml, so a backfill and
# the daily run never talk to SEAP at the same time: the second one waits. Dispatch the
# next day only once the previous run has finished; GitHub keeps one pending run per group
# and a newer pending dispatch replaces an older one.
#
# Re-running a day that is already archived costs the list calls (about 12) and fetches
# only acquisitions not yet stored.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day to collect (YYYY-MM-DD, Romanian time, at most yesterday)"
        required: true

concurrency:
  group: ingest-seap
  cancel-in-progress: false

permissions:
  # The day goes onto a data/backfill-<day> branch with a pull request into dev: main and dev
  # take changes by pull request only (rulesets cnw-production-gate, cnw-integration-gate).
  contents: write
  pull-requests: write
  issues: write            # a failed run opens or updates "SEAP collection failed"

jobs:
  backfill:
    runs-on: ubuntu-latest
    # A weekday at the cap is about 1 h 50 min; 300 leaves room for a slow day.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # The data branch is cut from dev, which a shallow clone of main does not hold.
          fetch-depth: 0

      # The authority lookup cache (data/autoritati.parquet) is only worth keeping if it
      # survives the job, so the next dispatch starts warm. *.parquet is gitignored, so it
      # travels in the Actions cache, not in git.
      - name: Restore the authority cache
        uses: actions/cache/restore@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}
          restore-keys: autoritati-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # `achizitii publish --only preturi` merges into the manifest of the published bundle,
      # which is a release asset rather than a committed file.
      - name: Fetch the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch_bundle.sh

      # Days already merged into dev are copied in first, so archived_ids() skips what is
      # stored and a re-run only fetches what is missing.
      - name: Start from the archive on dev
        run: |
          set -euo pipefail
          git fetch --quiet origin dev
          git worktree add --quiet "$RUNNER_TEMP/data-branch" origin/dev
          mkdir -p site/data/preturi
          rsync -a "$RUNNER_TEMP/data-branch/site/data/preturi/" site/data/preturi/

      # The CLI refuses a day that has not ended in Romanian time, stops at the first sign
      # of a block (and then writes nothing for the day), and writes the request counts to
      # the run summary either way.
      - name: Collect the day
        id: ingest
        env:
          DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          achizitii seap --start "$DAY" --end "$DAY" --report "$RUNNER_TEMP/seap-report.json"

      - name: Archive and commit the day
        env:
          DAY: ${{ inputs.day }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          achizitii publish --only preturi

          DATA_TREE="$RUNNER_TEMP/data-branch"
          BRANCH="data/backfill-$DAY"
          git -C "$DATA_TREE" switch --quiet -C "$BRANCH"
          # Day files are append-only, so copying them over dev's adds and never rewrites.
          rsync -a site/data/preturi/ "$DATA_TREE/site/data/preturi/"
          git -C "$DATA_TREE" add site/data/preturi
          if git -C "$DATA_TREE" diff --cached --quiet; then
            echo "Nothing new for $DAY." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$DATA_TREE" commit -q -m "data: unit prices for $DAY"
          # A re-run for the same day replaces the branch; it is the run's own, never shared.
          git -C "$DATA_TREE" push --quiet --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "pull request for $BRANCH already open; updated it"
          elif ! gh pr create --base dev --head "$BRANCH" --title "data: backfill unit prices for $DAY" \
              --body "Collected by run ${{ github.run_id }} (\`backfill.yml\`). Merge into dev; it reaches main with the next dev -> main promotion."; then
            # Needs "Allow GitHub Actions to create and approve pull requests" in the
            # repository settings. The branch is pushed either way.
            echo "::warning::could not open the pull request; open it from $BRANCH by hand: ${{ github.server_url }}/${{ github.repository }}/compare/dev...$BRANCH"
          fi
          # A pull request this token opened gets no `pull_request` run, so `verify` (which
          # dev requires) would never report. A dispatch is the one event the token may raise.
          if ! gh workflow run tests.yml --ref "$BRANCH"; then
            echo "::warning::could not start tests.yml on $BRANCH; run it by hand so the pull request can merge"
          fi
          echo "Collected $DAY on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Save the authority cache
        if: always() && hashFiles('data/autoritati.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}

      # Opens "SEAP collection failed", or comments on it if it is open, with the reason
      # from the ingest report.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: ./scripts/seap_failure_issue.sh "$RUNNER_TEMP/seap-report.json"
