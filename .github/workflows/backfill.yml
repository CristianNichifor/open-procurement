name: backfill unit prices

# Collects a range of past days from SEAP, unattended, on GitHub's infrastructure.
#
# WHY THIS EXISTS
#
# The bulk data.gov.ro exports are published quarterly — the newest 2026 resource is
# T II (April-June), released 13 July — so the archive ends on 2026-06-30 and everything
# since is invisible. Only the live API carries those days, and only it carries line
# items at all.
#
# It also runs where a laptop does not have to stay open. The daily job proved GitHub
# runners reach SEAP normally: a dispatch for 2026-07-05 returned 90 acquisitions and
# 123 line items with HTTP 200 throughout, from a different address than the one that
# got restricted.
#
# COST
#
# At 1.5 rps — under SEAP's published ceiling of 500 requests per 5 minutes — a weekday
# of ~8,300 acquisitions takes about 2 hours; a weekend day takes seconds. A 300-minute
# budget therefore covers roughly two and a half weekdays per dispatch.
#
# Minutes are free on a public repo, so the cost is wall-clock, not money. Before
# chaining many of these, read the rate note in config.MAX_RPS: SEAP also discourages
# continuous automated processes over long periods, whatever the rate.
#
# RESUMABILITY
#
# Every day is committed as it completes, and `archived_ids()` makes a re-run skip what
# is already stored. A job that hits the six-hour limit therefore loses nothing: dispatch
# it again with the same range and it carries on from where it stopped.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD)"
        required: true
      end:
        description: "Last day (YYYY-MM-DD)"
        required: true
      budget_minutes:
        description: "Stop cleanly after this many minutes (default 300, max job is 360)"
        required: false
        default: "300"

concurrency:
  group: ingest-seap
  cancel-in-progress: false

permissions:
  # The collected days go onto a data/backfill-* branch with a pull request into dev: main and
  # dev take changes by pull request only (rulesets cnw-production-gate, cnw-integration-gate).
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # The data branch is cut from dev, which a shallow clone of main does not hold.
          fetch-depth: 0

      # The authority lookup cache (data/autoritati.parquet) is only worth keeping if it
      # survives the job, so the next dispatch starts warm. *.parquet is gitignored, so it
      # travels in the Actions cache, not in git.
      - name: Restore the authority cache
        uses: actions/cache/restore@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}
          restore-keys: autoritati-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Collect, one day at a time
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          BUDGET: ${{ inputs.budget_minutes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Days are committed on a branch cut from dev, in a second worktree, so the code that
          # runs stays the checked-out ref; a pull request carries the branch into dev and the
          # dev -> main promotion takes it on. Days already merged into dev are copied into this
          # tree first, so archived_ids() skips them on a re-run.
          BRANCH="data/backfill-$START-$END-run${{ github.run_id }}"
          DATA_TREE="$RUNNER_TEMP/data-branch"
          git fetch --quiet origin dev
          git worktree add --quiet -B "$BRANCH" "$DATA_TREE" origin/dev
          mkdir -p site/data/preturi
          rsync -a "$DATA_TREE/site/data/preturi/" site/data/preturi/
          pr_open=

          deadline=$(( $(date +%s) + BUDGET * 60 ))
          day="$START"
          collected=0

          while [ "$(date -d "$day" +%s)" -le "$(date -d "$END" +%s)" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::budget reached; stopping cleanly at $day"
              echo "Re-run with start=$day end=$END to continue." >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            echo "::group::$day"
            # One failing day must not abandon the rest of the range.
            if achizitii seap --start "$day" --end "$day"; then
              achizitii publish --only preturi
              # Day files are append-only, so copying them over dev's adds and never rewrites.
              rsync -a site/data/preturi/ "$DATA_TREE/site/data/preturi/"
              git -C "$DATA_TREE" add site/data
              if ! git -C "$DATA_TREE" diff --cached --quiet; then
                git -C "$DATA_TREE" commit -q -m "data: unit prices for $day"
                # Pushed after every day, so a job that hits the time limit loses nothing.
                # The branch belongs to this run alone.
                git -C "$DATA_TREE" push --quiet --force origin "$BRANCH"
                if [ -z "$pr_open" ]; then
                  if gh pr create --base dev --head "$BRANCH" --title "data: backfill unit prices $START to $END" \
                      --body "Days collected by run ${{ github.run_id }} (\`backfill.yml\`); each day is one commit. Merge into dev; it reaches main with the next dev -> main promotion."; then
                    :
                  else
                    # Needs "Allow GitHub Actions to create and approve pull requests" in the
                    # repository settings. The branch is pushed either way.
                    echo "::warning::could not open the pull request; open it from $BRANCH by hand: ${{ github.server_url }}/${{ github.repository }}/compare/dev...$BRANCH"
                  fi
                  pr_open=1
                fi
                collected=$((collected + 1))
              else
                echo "nothing new for $day"
              fi
            else
              echo "::warning::$day failed; continuing with the rest of the range"
            fi
            echo "::endgroup::"

            day=$(date -d "$day + 1 day" +%F)
          done

          echo "Collected $collected new day(s) on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Save the authority cache
        if: always() && hashFiles('data/autoritati.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}

      - name: Report what the archive now holds
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import duckdb
          files = sorted(pathlib.Path("site/data/preturi").rglob("*.parquet"))
          if not files:
              print("Archive is empty.")
              raise SystemExit(0)
          con = duckdb.connect()
          rows, first, last = con.execute(
              "SELECT count(*), min(CAST(data_finalizare AS DATE)),"
              " max(CAST(data_finalizare AS DATE))"
              f" FROM read_parquet({[str(f) for f in files]})"
          ).fetchone()
          print(f"\n**Archive:** {len(files)} days, {rows:,} line items, {first} to {last}.")
          PY
