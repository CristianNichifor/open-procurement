name: SEAP line items

on:
  # HELD, 2026-09-08. No SEAP traffic until ADR answers the request sent 2026-09-07.
  #
  # The schedule stays, and the SEAP ingest below is what is switched off: the cron keeps
  # refreshing the meetings register, rebuilding the bundle and uploading to R2, none of
  # which touches SEAP. Removing the whole trigger would have stopped those as collateral
  # and left the R2 path unexercised, which is the opposite of useful while we wait.
  #
  # To resume: run the workflow by hand (Actions -> "SEAP line items" -> Run workflow).
  # A manual run always ingests. To go back to collecting automatically, delete the
  # `if:` on the Ingest step.
  #
  # THE COST OF WAITING, so it is not discovered later: unit prices cannot be
  # reconstructed retroactively — the bulk exports carry no quantities — so the archive
  # only ever grows forward from the first day collected. Every day spent held is a day
  # that can never be added. 2026-09-05 and 2026-09-07 are already missing.
  schedule:
    # Once a day. It was briefly set to every three hours; then SICAP IP-blocked us
    # for "trafic automat care depaseste limitele de utilizare normala" and the whole
    # question changed from "how fresh can this be" to "do we have access at all".
    #
    # Frequency is not the main cost — archived_ids() means a repeat run of the same day
    # fetches almost nothing — but until access is restored and we understand what the
    # platform considers normal, once a day is what the previous months ran at without
    # complaint. Raise it only with evidence, not with a throughput measurement.
    - cron: "20 4 * * *"
  # A merge to main rebuilds the bundle and refreshes R2 at once instead of at 04:20.
  # Without the dispatch the ingest stays off, so the hold above still holds.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      limit:
        description: "Cap records per day (smoke test only)"
        required: false

# Never two writers on state/ or the data branch.
concurrency:
  group: ingest-seap
  cancel-in-progress: false

permissions:
  # write: the run commits the day's prices, which is the only durable copy, to a data/<day>
  # branch and opens a pull request into dev. main and dev take changes by pull request only
  # (rulesets cnw-production-gate and cnw-integration-gate), so the day reaches main through
  # the normal dev -> main promotion.
  contents: write
  pull-requests: write
  id-token: write          # the broker reads this job's GitHub OIDC token

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The authority lookup cache (data/autoritati.parquet, cui -> judet) is only worth having
      # if it survives the job. *.parquet is gitignored, so it travels in the Actions cache,
      # not in git: restored here, saved at the end of the job.
      - name: Restore the authority cache
        uses: actions/cache/restore@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}
          restore-keys: autoritati-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # The bundle is a release asset rather than a committed tree, and several tests read it
      # directly — test_price_drilldown opens site/data/manifest.json unconditionally, which is
      # the point: it used to carry a skipif that turned into a pass. pages.yml, tests.yml and
      # browser.yml each fetch it before running; this workflow also runs pytest and did not,
      # so the first scheduled run after that change failed here, on 2026-09-11.
      #
      # It matters more here than the failure suggests. `Test` runs before `Ingest`, so a job
      # that cannot fetch the bundle never collects — and the manual dispatch this file calls
      # "one button as the way back" from the hold would have failed before collecting a day.
      - name: Fetch the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch_bundle.sh

      - name: Test
        run: pytest -q

      # A scheduled run does NOT collect from SEAP while the hold above is in place; a
      # run someone started by hand does. That keeps one button as the way back, rather
      # than an edit to this file.
      - name: Ingest
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then
            ARGS+=(--start "${{ inputs.start }}")
            [ -n "${{ inputs.end }}" ] && ARGS+=(--end "${{ inputs.end }}")
          else
            # The three days ending YESTERDAY. Today is never collected: the window is
            # `end = yesterday, start = end - (days_back - 1)`, so a day is only fetched
            # once it has finished in Romanian local time. The comment this replaces said
            # "today and yesterday", which the code has never done.
            #
            # Three days, not one, because GitHub's
            # scheduler is not a clock. This workflow asks for 04:20 UTC; an observed
            # run started at 09:20 — five hours late — and GitHub documents that
            # scheduled runs may be delayed or DROPPED ENTIRELY under load.
            #
            # With a one-day window, two consecutive misses lose a day for good: unit
            # prices cannot be backfilled, because no bulk export carries quantities.
            # The archive only ever grows forward from the first day collected, so a
            # hole in it is permanent.
            #
            # Re-covering a day already collected is nearly free. archived_ids() drops
            # every acquisition already stored before any detail call is made, so the
            # cost is the list requests alone: about 29 per day, roughly 20 seconds at
            # 1.5 rps. Three days of insurance costs about a minute.
            ARGS+=(--days-back 3)
          fi
          [ -n "${{ inputs.limit }}" ] && ARGS+=(--limit "${{ inputs.limit }}")
          achizitii seap "${ARGS[@]}"

      - name: Summarise
        run: |
          python - <<'PY'
          import pathlib
          import duckdb
          if not list(pathlib.Path("site/data/items").rglob("*.parquet")):
              print("no data produced")
              raise SystemExit(0)
          duckdb.sql("""
            SELECT count(*) items,
                   sum(comparabil::INT) comparabile,
                   count(DISTINCT judet) judete,
                   count(DISTINCT cpv) cpv
            FROM 'site/data/items/**/*.parquet'
          """).show()
          PY

      # Unit prices cannot be backfilled — the bulk exports carry no quantities, and
      # rebuilding history from SEAP would mean a per-record call for every acquisition
      # ever published. The archive can only grow forwards from the first day collected,
      # so a lost day is lost for good. This is the step that makes the run durable;
      # without it the data expired with the artefact after 30 days.
      # The meetings register gains entries continuously and costs 7 requests to
      # mirror in full, so it is refreshed on the same schedule. It is published as its
      # own table and joined to nothing — see src/achizitii/ruti.py.
      - name: Refresh the RUTI meetings register
        run: achizitii ruti
        continue-on-error: true

      - name: Archive prices and rebuild the published bundle
        run: achizitii publish --only preturi

      # R2 credentials are minted per run by the CN Webify token broker, which trusts this
      # job's GitHub OIDC token: no Cloudflare secret lives in the repository. The broker
      # admits this exact file, on main, on schedule/push/dispatch, and scopes the token to
      # writing objects in the `open-procurement` bucket of the CN Webify Customers account.
      #
      # It is fetched here, after the ingest, and not at the top of the job: the token lives
      # one hour and the ingest alone may take most of the five-hour timeout.
      #
      # A fork, or a run off main, has no way to get a token, so both are a skip that says
      # so, not a failure. The guard is a shell test inside the step on purpose: an `if:` on
      # the step is silent when it skips, and silence is the symptom this step once had.
      - name: Cloudflare token from the CN Webify broker
        id: broker
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "CristianNichifor/open-procurement" ] \
            || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::R2 skipped: the broker serves CristianNichifor/open-procurement on main only (this is ${GITHUB_REPOSITORY} on ${GITHUB_REF}); data stays on Pages only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jwt=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://tokens.cnwebify.com" | jq -r .value)
          reply=$(curl -sf -X POST -H "Authorization: Bearer $jwt" https://tokens.cnwebify.com/token)
          token=$(jq -r .token <<<"$reply"); echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=5d5a0c8a05e5d8292065cd0c0cf60291" >> "$GITHUB_ENV"
          # R2's S3 API takes the token's id as the access key and the SHA-256 of the token
          # as the secret. Both are masked before they reach the environment.
          key_id=$(jq -r .token_id <<<"$reply"); echo "::add-mask::$key_id"
          secret=$(printf %s "$token" | sha256sum | cut -d' ' -f1); echo "::add-mask::$secret"
          echo "R2_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "R2_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Consolidates the daily archive into monthly Parquet and uploads it. The account and
      # bucket are not secret — the account id is in every dashboard URL — so they are set
      # here in the open; only the keys come from the broker step.
      - name: Publish data to R2
        if: steps.broker.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: "5d5a0c8a05e5d8292065cd0c0cf60291"
          R2_BUCKET: open-procurement
        run: |
          set -euo pipefail
          echo "Uploading to bucket '${R2_BUCKET}' in CN Webify Customers."
          pip install -e ".[r2]"
          achizitii publish --only preturi --r2

      - name: Commit the day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only what git is meant to hold: the published bundle and day files. The authority
          # cache is gitignored (*.parquet) and kept in the Actions cache instead.
          git add site/data
          if git diff --cached --quiet; then
            echo "nothing new to archive"
            exit 0
          fi
          # Day files are written once and never rewritten, so this only ever adds.
          # The DATA date, not the run date. The daily job collects yesterday, so
          # stamping today's date on it produced commits like "unit prices for
          # 2026-09-07" holding 2026-09-06 data — and a backfill test for 2026-07-05
          # landed under 2026-09-07 too, which makes the history unreadable.
          DAY=$(python -c "import datetime,zoneinfo;print((datetime.datetime.now(zoneinfo.ZoneInfo('Europe/Bucharest')).date()-datetime.timedelta(days=1)).isoformat())")
          # main and dev accept pull requests only, so the day goes onto data/<day>, cut from
          # dev, and a pull request carries it into dev; the dev -> main promotion takes it on.
          # The staged files move over with a stash: anything that conflicts with dev is a
          # genuine problem and fails the run (the artefacts below keep the raw data).
          BRANCH="data/$DAY"
          git stash push --quiet --staged
          git fetch --quiet origin dev
          git switch --quiet -C "$BRANCH" origin/dev
          git stash pop --quiet --index
          # While the ingest is held, a scheduled run commits the meetings register and
          # a rebuilt bundle and nothing else. Saying "archive unit prices" over that
          # would put a claim in the history that the run did not do.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TITLE="data: archive unit prices for $DAY"
            git commit -m "$TITLE

          Generated by the daily SEAP ingest. Line items are distilled to the slim
          comparable schema (~47 bytes a row) and written one file per day, so git
          stores each day once instead of a growing monthly file thirty times."
          else
            TITLE="data: refresh the meetings register and rebuild the bundle"
            git commit -m "$TITLE

          Run without the SEAP ingest, which is held — see the note on the schedule
          trigger in .github/workflows/publish-data.yml. No SEAP endpoint was contacted."
          fi
          # A re-run for the same day replaces the branch; it is the run's own, never shared.
          git push --quiet --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "pull request for $BRANCH already open; updated it"
          elif ! gh pr create --base dev --head "$BRANCH" --title "$TITLE" \
              --body "Data from run ${{ github.run_id }} (\`publish-data.yml\`). Merge into dev; it reaches main with the next dev -> main promotion."; then
            # Needs "Allow GitHub Actions to create and approve pull requests" in the repository
            # settings. The branch is pushed either way, so the day is not lost.
            echo "::warning::could not open the pull request; open it from $BRANCH by hand: ${{ github.server_url }}/${{ github.repository }}/compare/dev...$BRANCH"
          fi

      - name: Save the authority cache
        if: always() && hashFiles('data/autoritati.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/autoritati.parquet
          key: autoritati-${{ github.run_id }}

      - name: Upload raw artefacts
        uses: actions/upload-artifact@v4
        with:
          name: seap-${{ github.run_id }}
          path: |
            site/data/items
            data/core
          retention-days: 30
          if-no-files-found: warn
